
; ref
; https://www.php.net/manual/en/install.fpm.configuration.php

;   http://www.foo.bar/status
;   http://www.foo.bar/status?json
;   http://www.foo.bar/status?html
;   http://www.foo.bar/status?xml


[global]

daemonize = no
events.mechanism = epoll

error_log = /var/log/php-fpm.log
; Not debug: at debug, php-fpm 7.4 crashes the worker (SIGSEGV) whenever a PHP
; log message is 16 to 28 bytes long.
log_level = notice

[www]

listen = 0.0.0.0:9000
user = www-data
group = www-data

;chroot = /data/web/
;chdir = /
pm = static
pm.max_children = 100
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 8

; Hand the container's environment to the workers.
;
; php-fpm clears it by default, so getenv() returns false for everything the
; container was started with - while `env` in a shell in that same container
; shows it all, which makes the symptom very hard to read. An app configured
; the usual Docker way, by environment variable, silently falls back to its
; defaults and says nothing about it.
;
; babble_web lost an evening to this: its call records URL and its AI
; scheduler URL both read from getenv(), both came back empty on a server
; where both were set, and the code took its silent fallback path without
; opening a socket.
;
; Changing this needs the container restarted - a USR2 reload leaves the
; existing workers with the environment they already had.
clear_env = no

; Keep what workers write to stderr. The PHP 7.4 security patch ends a worker
; that runs out of memory_limit on the spot, and the "Allowed memory size"
; error naming the script only goes to its stderr.
catch_workers_output = yes
decorate_workers_output = no

php_value[session.save_handler] = files
php_value[session.save_path]    = /var/lib/php/session

